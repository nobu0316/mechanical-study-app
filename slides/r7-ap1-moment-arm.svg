<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" role="img" aria-labelledby="title desc">
  <title id="title">支点Oと2本の水平な力の作用線</title>
  <desc id="desc">Oの上180 mmにP、上330 mmにFの水平作用線。Fの作用点はOから右50 mm。寸法は模式図。</desc>
  <rect width="560" height="320" rx="12" fill="#f4f7fb"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#155e75"/></marker></defs>
  <g font-family="sans-serif" font-size="18" fill="#172b4d">
    <path d="M210 252 305 55" fill="none" stroke="#94a3b8" stroke-width="8"/>
    <path d="M210 35V270" stroke="#64748b" stroke-dasharray="5 5"/>
    <path d="M182 55H510 M182 145H510" stroke="#155e75" stroke-dasharray="6 5"/>
    <path d="M305 55H470 M405 145H260" stroke="#155e75" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="340" y="40">Fの作用線 →</text><text x="340" y="130">← Pの作用線</text>
    <circle cx="210" cy="252" r="6" fill="#172b4d"/><text x="225" y="258">支点O</text>
    <g fill="none" stroke="#64748b" stroke-width="2">
      <path d="M80 55V252 M72 55H88 M72 252H88 M150 145V252 M142 145H158 M142 252H158"/>
      <path d="M80 55H182 M80 252H205 M150 145H182" stroke-dasharray="3 4"/>
      <path d="M210 55V70H225 M305 55V284" stroke-dasharray="3 4"/>
      <path d="M210 280H305 M210 274V286 M305 274V286"/>
    </g>
    <text x="12" y="125">330</text><text x="12" y="148">mm</text>
    <text x="91" y="192">180</text><text x="91" y="215">mm</text>
    <text x="220" y="307">50 mm</text><text x="377" y="290" font-size="14">寸法は模式図</text>
  </g>
</svg>
