<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Pの式はRを消して作る</title>
  <desc id="desc">PとQを割ってRを消し、加法定理の符号を確認し、tan rhoをmuに置き換える式変形</desc>
  <rect width="960" height="540" rx="28" fill="#f7fafc"/>
  <text x="54" y="62" font-family="sans-serif" font-size="34" font-weight="700" fill="#17324d">Pの式はRを消して作る</text>
  <rect x="54" y="92" width="852" height="72" rx="18" fill="#ffffff" stroke="#d5e2ea" stroke-width="2"/>
  <text x="78" y="137" font-family="sans-serif" font-size="27" fill="#17324d">①  P＝R cos(θ－ρ)　　Q＝R cos(β＋ρ)</text>
  <path d="M480 166 V193" stroke="#365b73" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="54" y="202" width="852" height="66" rx="18" fill="#e8f3fb"/>
  <text x="78" y="245" font-family="sans-serif" font-size="27" font-weight="700" fill="#28617f">②  P/Q にして R を消す</text>
  <path d="M480 270 V297" stroke="#365b73" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="54" y="306" width="400" height="88" rx="18" fill="#fff4ef"/>
  <text x="78" y="342" font-family="sans-serif" font-size="24" font-weight="700" fill="#a94028">③ 符号</text>
  <text x="78" y="375" font-family="sans-serif" font-size="24" fill="#17324d">cos(θ－ρ) → ＋　 cos(β＋ρ) → －</text>
  <rect x="506" y="306" width="400" height="88" rx="18" fill="#eef8f6"/>
  <text x="530" y="342" font-family="sans-serif" font-size="24" font-weight="700" fill="#12656a">④ 置換</text>
  <text x="530" y="375" font-family="sans-serif" font-size="27" fill="#17324d">tanρ ＝ μ</text>
  <path d="M480 396 V423" stroke="#365b73" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="128" y="432" width="704" height="78" rx="22" fill="#dff3f1" stroke="#9dcec8" stroke-width="2"/>
  <text x="176" y="482" font-family="sans-serif" font-size="29" font-weight="700" fill="#17324d">⑤  P ＝ Q(cosθ＋μsinθ) / (cosβ－μsinβ)</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L10 3 L0 6 Z" fill="#365b73"/></marker></defs>
</svg>
