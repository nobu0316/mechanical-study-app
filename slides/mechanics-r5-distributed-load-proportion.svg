<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">途中位置xの荷重は比例で考える</title>
  <desc id="desc">Oで0、Aでqとなる三角形分布荷重について、途中位置xの荷重がqx/lであることを半分と4分の1の例で示す。</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0fdfa"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <marker id="loadArrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#0891b2"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="28" fill="url(#bg2)"/>
  <text x="64" y="72" font-family="'Yu Gothic',sans-serif" font-size="40" font-weight="700" fill="#0f172a">途中位置xの荷重は比例で考える</text>
  <rect x="58" y="105" width="760" height="460" rx="22" fill="#fff" stroke="#99f6e4" stroke-width="3"/>
  <line x1="125" y1="440" x2="750" y2="440" stroke="#334155" stroke-width="7" stroke-linecap="round"/>
  <polygon points="135,420 740,165 740,420" fill="#cffafe" stroke="#06b6d4" stroke-width="4"/>
  <g stroke="#0891b2" stroke-width="3" marker-end="url(#loadArrow)">
    <line x1="135" y1="410" x2="135" y2="434"/>
    <line x1="285" y1="347" x2="285" y2="434"/>
    <line x1="438" y1="282" x2="438" y2="434"/>
    <line x1="590" y1="218" x2="590" y2="434"/>
    <line x1="740" y1="155" x2="740" y2="434"/>
  </g>
  <g font-family="'Yu Gothic',sans-serif">
    <text x="120" y="476" font-size="25" font-weight="700" fill="#0f172a">O</text>
    <text x="731" y="476" font-size="25" font-weight="700" fill="#0f172a">A</text>
    <text x="102" y="405" font-size="22" fill="#475569">0</text>
    <text x="762" y="174" font-size="29" font-weight="800" fill="#0e7490">q</text>
    <text x="424" y="476" font-size="23" font-weight="700" fill="#0f172a">l/2</text>
    <text x="270" y="476" font-size="23" font-weight="700" fill="#0f172a">l/4</text>
    <text x="456" y="295" font-size="23" font-weight="700" fill="#0e7490">q/2</text>
    <text x="302" y="359" font-size="23" font-weight="700" fill="#0e7490">q/4</text>
  </g>
  <line x1="135" y1="520" x2="740" y2="520" stroke="#64748b" stroke-width="2"/>
  <line x1="135" y1="509" x2="135" y2="531" stroke="#64748b" stroke-width="2"/>
  <line x1="740" y1="509" x2="740" y2="531" stroke="#64748b" stroke-width="2"/>
  <text x="438" y="553" text-anchor="middle" font-family="'Yu Gothic',sans-serif" font-size="25" font-style="italic" fill="#334155">OA = l</text>
  <rect x="850" y="115" width="294" height="178" rx="20" fill="#0f766e"/>
  <text x="997" y="164" text-anchor="middle" font-family="'Yu Gothic',sans-serif" font-size="22" font-weight="700" fill="#ccfbf1">Oから x の位置</text>
  <text x="997" y="235" text-anchor="middle" font-family="'Yu Gothic',sans-serif" font-size="47" font-weight="800" fill="#fff">qx / l</text>
  <text x="997" y="270" text-anchor="middle" font-family="'Yu Gothic',sans-serif" font-size="18" fill="#ccfbf1">進んだ割合 x/l を q に掛ける</text>
  <rect x="850" y="320" width="294" height="96" rx="18" fill="#fff" stroke="#5eead4" stroke-width="3"/>
  <text x="997" y="357" text-anchor="middle" font-family="'Yu Gothic',sans-serif" font-size="22" font-weight="700" fill="#115e59">半分進む → 荷重も半分</text>
  <text x="997" y="392" text-anchor="middle" font-family="'Yu Gothic',sans-serif" font-size="26" font-weight="800" fill="#0f766e">x=l/2 → q/2</text>
  <rect x="850" y="436" width="294" height="96" rx="18" fill="#fff" stroke="#67e8f9" stroke-width="3"/>
  <text x="997" y="473" text-anchor="middle" font-family="'Yu Gothic',sans-serif" font-size="22" font-weight="700" fill="#155e75">1/4進む → 荷重も1/4</text>
  <text x="997" y="508" text-anchor="middle" font-family="'Yu Gothic',sans-serif" font-size="26" font-weight="800" fill="#0e7490">x=l/4 → q/4</text>
  <rect x="58" y="590" width="1086" height="53" rx="14" fill="#164e63"/>
  <text x="601" y="625" text-anchor="middle" font-family="'Yu Gothic',sans-serif" font-size="26" font-weight="700" fill="#fff">最大が q/4 なら　(q/4)(x/l) = qx/(4l)</text>
</svg>
