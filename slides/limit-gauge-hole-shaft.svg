<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">限界ゲージ ― 穴と軸のGOを混同しない</title>
  <desc id="desc">穴用はGOが下限でNO-GOが上限。軸用はGOが上限でNO-GOが下限。穴にはプラグゲージ、軸にはリングゲージを使うことを比較した図。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4fbfc"/>
      <stop offset="1" stop-color="#edf5f8"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9e6eb"/>
      <stop offset="1" stop-color="#9fb5bf"/>
    </linearGradient>
    <pattern id="holePattern" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#26748a" stroke-width="3" opacity=".18"/>
    </pattern>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#176b87"/>
    </marker>
    <style>
      text{font-family:Arial,'Yu Gothic',Meiryo,sans-serif;fill:#102a36}
      .title{font-size:34px;font-weight:800}
      .headline{font-size:35px;font-weight:900;letter-spacing:.5px}
      .side{font-size:31px;font-weight:900}
      .gauge{font-size:27px;font-weight:900}
      .limit{font-size:31px;font-weight:900}
      .label{font-size:19px;font-weight:800}
      .flow{font-size:19px;font-weight:800}
      .tableHead{font-size:19px;font-weight:900}
      .tableText{font-size:25px;font-weight:900}
      .small{font-size:16px;font-weight:700}
      .white{fill:#fff}
      .goText{fill:#096b50}
      .noGoText{fill:#a23c30}
      .blue{fill:#176b87}
    </style>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="44" y="48" class="title">限界ゲージ ― 穴と軸のGOを混同しない</text>
  <rect x="742" y="16" width="414" height="48" rx="24" fill="#102a36"/>
  <text x="949" y="50" text-anchor="middle" class="headline white">穴GOは下、軸GOは上</text>

  <!-- 穴用カード -->
  <rect x="38" y="82" width="546" height="330" rx="22" fill="#fff" stroke="#6aa9b7" stroke-width="3"/>
  <rect x="38" y="82" width="546" height="54" rx="22" fill="#dff3f5"/>
  <path d="M38 114H584V136H38Z" fill="#dff3f5"/>
  <text x="66" y="120" class="side blue">穴用</text>
  <text x="555" y="118" text-anchor="end" class="label blue">プラグゲージを差す</text>

  <rect x="62" y="151" width="218" height="59" rx="13" fill="#dff5eb" stroke="#0b8060" stroke-width="2"/>
  <text x="78" y="188" class="gauge goText">GO（通り側）</text>
  <text x="300" y="190" class="limit goText">＝ 下限寸法</text>
  <rect x="62" y="220" width="218" height="52" rx="13" fill="#fff0ed" stroke="#bd5346" stroke-width="2"/>
  <text x="78" y="253" class="gauge noGoText">NO-GO</text>
  <text x="300" y="254" class="limit noGoText">＝ 上限寸法</text>

  <g transform="translate(68 287)">
    <rect x="0" y="0" width="118" height="94" rx="12" fill="url(#holePattern)" stroke="#26748a" stroke-width="3"/>
    <circle cx="59" cy="47" r="29" fill="#fff" stroke="#26748a" stroke-width="4"/>
    <text x="59" y="53" text-anchor="middle" class="label blue">穴</text>
    <rect x="184" y="29" width="122" height="36" rx="18" fill="url(#metal)" stroke="#466c79" stroke-width="3"/>
    <rect x="285" y="20" width="46" height="54" rx="8" fill="#176b87"/>
    <text x="245" y="17" text-anchor="middle" class="small">GOプラグ</text>
    <line x1="174" y1="47" x2="126" y2="47" stroke="#176b87" stroke-width="5" marker-end="url(#arrowBlue)"/>
  </g>
  <rect x="422" y="290" width="139" height="91" rx="15" fill="#f4fafb" stroke="#bdd5dc" stroke-width="2"/>
  <text x="491" y="315" text-anchor="middle" class="flow">穴が小さい</text>
  <text x="491" y="339" text-anchor="middle" class="flow blue">↓ GOが入らない</text>
  <text x="491" y="365" text-anchor="middle" class="flow goText">だから下限</text>

  <!-- 軸用カード -->
  <rect x="616" y="82" width="546" height="330" rx="22" fill="#fff" stroke="#8e85ba" stroke-width="3"/>
  <rect x="616" y="82" width="546" height="54" rx="22" fill="#eeeafb"/>
  <path d="M616 114H1162V136H616Z" fill="#eeeafb"/>
  <text x="644" y="120" class="side" fill="#51448e">軸用</text>
  <text x="1133" y="118" text-anchor="end" class="label" fill="#51448e">リングゲージを通す</text>

  <rect x="640" y="151" width="218" height="59" rx="13" fill="#dff5eb" stroke="#0b8060" stroke-width="2"/>
  <text x="656" y="188" class="gauge goText">GO（通り側）</text>
  <text x="878" y="190" class="limit goText">＝ 上限寸法</text>
  <rect x="640" y="220" width="218" height="52" rx="13" fill="#fff0ed" stroke="#bd5346" stroke-width="2"/>
  <text x="656" y="253" class="gauge noGoText">NO-GO</text>
  <text x="878" y="254" class="limit noGoText">＝ 下限寸法</text>

  <g transform="translate(646 287)">
    <rect x="0" y="29" width="176" height="36" rx="18" fill="url(#metal)" stroke="#51448e" stroke-width="3"/>
    <text x="88" y="17" text-anchor="middle" class="small">軸</text>
    <circle cx="250" cy="47" r="44" fill="#eeeafb" stroke="#51448e" stroke-width="5"/>
    <circle cx="250" cy="47" r="26" fill="#fff" stroke="#51448e" stroke-width="3"/>
    <text x="250" y="105" text-anchor="middle" class="small">GOリング</text>
    <line x1="183" y1="47" x2="216" y2="47" stroke="#51448e" stroke-width="5" marker-end="url(#arrowBlue)"/>
  </g>
  <rect x="1000" y="290" width="139" height="91" rx="15" fill="#f7f5fc" stroke="#cec7e7" stroke-width="2"/>
  <text x="1069" y="315" text-anchor="middle" class="flow">軸が太い</text>
  <text x="1069" y="339" text-anchor="middle" class="flow" fill="#51448e">↓ GOを通らない</text>
  <text x="1069" y="365" text-anchor="middle" class="flow goText">だから上限</text>

  <!-- 比較表 -->
  <rect x="38" y="431" width="752" height="202" rx="20" fill="#fff" stroke="#b7cbd2" stroke-width="3"/>
  <text x="63" y="462" class="label">3秒比較表</text>
  <rect x="62" y="476" width="704" height="45" rx="10" fill="#102a36"/>
  <text x="168" y="506" text-anchor="middle" class="tableHead white">対象</text>
  <text x="414" y="506" text-anchor="middle" class="tableHead white">GO（通り側）</text>
  <text x="649" y="506" text-anchor="middle" class="tableHead white">NO-GO（止まり側）</text>
  <rect x="62" y="527" width="704" height="43" rx="8" fill="#eef9f6"/>
  <text x="168" y="556" text-anchor="middle" class="tableText blue">穴</text>
  <text x="414" y="556" text-anchor="middle" class="tableText goText">下限</text>
  <text x="649" y="556" text-anchor="middle" class="tableText noGoText">上限</text>
  <rect x="62" y="576" width="704" height="43" rx="8" fill="#f3f0fb"/>
  <text x="168" y="605" text-anchor="middle" class="tableText" fill="#51448e">軸</text>
  <text x="414" y="605" text-anchor="middle" class="tableText goText">上限</text>
  <text x="649" y="605" text-anchor="middle" class="tableText noGoText">下限</text>

  <!-- 使い分けカード -->
  <rect x="812" y="431" width="350" height="202" rx="20" fill="#fff" stroke="#b7cbd2" stroke-width="3"/>
  <text x="837" y="462" class="label">ゲージの使い分け</text>
  <rect x="836" y="478" width="302" height="59" rx="14" fill="#e9f6f8"/>
  <text x="859" y="514" class="tableText blue">穴</text>
  <text x="925" y="514" class="label">→ プラグゲージ → 穴に差す</text>
  <rect x="836" y="551" width="302" height="59" rx="14" fill="#f1eef9"/>
  <text x="859" y="588" class="tableText" fill="#51448e">軸</text>
  <text x="925" y="580" class="label">→ リングゲージ</text>
  <text x="925" y="601" class="small">　 または はさみゲージ</text>
  <text x="600" y="660" text-anchor="middle" class="small" fill="#536b75">GO＝最大実体側を確認する、と考えると穴と軸を区別しやすい</text>
</svg>
