<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="shaft" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eefbfc"/><stop offset="1" stop-color="#cceff2"/></linearGradient><pattern id="shear" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="12" stroke="#f15a24" stroke-width="4" opacity=".28"/></pattern>
    <marker id="arrowF" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#f15a24"/></marker><marker id="arrowDim" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#138a8f"/></marker>
    <style>text{font-family:Arial,'Yu Gothic',Meiryo,sans-serif;fill:#0a1830}.title{font-size:49px;font-weight:800}.message{font-size:28px;font-weight:800}.head{font-size:24px;font-weight:800}.body{font-size:20px}.small{font-size:17px}.eq{font-size:28px;font-weight:800}.navy{fill:#0b2e67}.orange{fill:#f15a24}.teal{fill:#138a8f}.white{fill:#fff}</style>
  </defs>
  <rect width="1200" height="675" fill="#fbfdff"/><rect width="14" height="675" fill="#0b2e67"/><text x="42" y="59" class="title">円周力からキー長さへ</text>
  <rect x="42" y="78" width="1116" height="56" rx="12" fill="#0b2e67"/><text x="600" y="116" text-anchor="middle" class="message white">求めた<tspan class="orange">円周力 F</tspan>が、キーをせん断しようとする</text>
  <g aria-label="計算の一本道">
    <text x="50" y="171" class="head navy">計算の一本道</text><line x1="78" y1="196" x2="78" y2="514" stroke="#9bb0c8" stroke-width="4"/>
    <circle cx="78" cy="204" r="23" fill="#0b2e67"/><text x="78" y="212" text-anchor="middle" class="body white" font-weight="800">1</text><text x="116" y="211" class="head">軸動力・回転速度</text><text x="78" y="259" text-anchor="middle" class="head navy">↓</text>
    <circle cx="78" cy="286" r="23" fill="#0b2e67"/><text x="78" y="294" text-anchor="middle" class="body white" font-weight="800">2</text><text x="116" y="294" class="head navy">トルク T</text><text x="78" y="341" text-anchor="middle" class="head navy">↓</text>
    <circle cx="78" cy="368" r="23" fill="#f15a24"/><text x="78" y="376" text-anchor="middle" class="body white" font-weight="800">3</text><text x="116" y="376" class="head">円周力　<tspan class="orange">F = 2T/d</tspan></text><text x="78" y="423" text-anchor="middle" class="head navy">↓</text>
    <circle cx="78" cy="450" r="23" fill="#0b2e67"/><text x="78" y="458" text-anchor="middle" class="body white" font-weight="800">4</text><text x="116" y="458" class="head">キーのせん断　<tspan class="navy">τ = F/(b l)</tspan></text><text x="78" y="505" text-anchor="middle" class="head navy">↓</text>
    <circle cx="78" cy="532" r="23" fill="#138a8f"/><text x="78" y="540" text-anchor="middle" class="body white" font-weight="800">5</text><text x="116" y="540" class="head">必要キー長さ　<tspan class="teal">l = F/(τa b)</tspan></text><text x="116" y="570" class="small">τ：発生するせん断応力　　τa：許容せん断応力</text>
  </g>
  <g aria-label="共通の軸とキーのせん断図">
    <rect x="535" y="156" width="623" height="348" rx="14" fill="#fff" stroke="#cbd6e1" stroke-width="2"/><circle cx="694" cy="326" r="112" fill="url(#shaft)" stroke="#075b66" stroke-width="6"/><circle cx="694" cy="326" r="7" fill="#0b2e67"/>
    <line x1="694" y1="326" x2="694" y2="214" stroke="#138a8f" stroke-width="4" marker-start="url(#arrowDim)" marker-end="url(#arrowDim)"/><text x="712" y="275" class="body teal">d/2</text><rect x="677" y="198" width="376" height="76" rx="4" fill="#ffd477" stroke="#9a5b0a" stroke-width="4"/><rect x="677" y="198" width="376" height="76" rx="4" fill="url(#shear)"/><text x="727" y="190" class="head">キー</text><text x="811" y="244" class="head">せん断面積 A = <tspan class="teal">b × l</tspan></text>
    <line x1="1053" y1="178" x2="1130" y2="178" stroke="#f15a24" stroke-width="8" marker-end="url(#arrowF)"/><text x="1067" y="162" class="eq orange">F</text><line x1="683" y1="305" x2="1047" y2="305" stroke="#138a8f" stroke-width="3" marker-start="url(#arrowDim)" marker-end="url(#arrowDim)"/><text x="865" y="337" text-anchor="middle" class="head teal">キー長さ l</text><line x1="1080" y1="201" x2="1080" y2="271" stroke="#138a8f" stroke-width="3" marker-start="url(#arrowDim)" marker-end="url(#arrowDim)"/><text x="1100" y="244" class="head teal">b</text>
    <path d="M769 375h245" stroke="#f15a24" stroke-width="6" marker-end="url(#arrowF)"/><text x="892" y="362" text-anchor="middle" class="head orange">キーを横方向へずらそうとする</text><text x="845" y="430" text-anchor="middle" class="body">この横ずれに <tspan class="teal" font-weight="800">b × l</tspan> の面積で耐える</text><text x="845" y="470" text-anchor="middle" class="eq navy">τ = F/(b l)</text>
  </g>
  <g aria-label="増減関係">
    <line x1="535" y1="526" x2="1158" y2="526" stroke="#d5dee8" stroke-width="2"/><text x="555" y="562" class="head orange">F 大</text><text x="620" y="562" class="body">→ 必要な l は長い</text><text x="803" y="562" class="head teal">b 大</text><text x="868" y="562" class="body">→ 必要な l は短い</text><text x="555" y="597" class="head teal">τa 大</text><text x="635" y="597" class="body">→ 必要な l は短い</text>
  </g>
  <rect x="42" y="612" width="1116" height="48" rx="10" fill="#0b2e67"/><text x="600" y="645" text-anchor="middle" class="message white">トルク → <tspan class="orange">円周力</tspan> → せん断 → <tspan class="teal">キー長さ</tspan></text>
</svg>
