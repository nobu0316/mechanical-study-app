<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">仮想荷重は変位を見るための探針</title>
  <desc id="desc">知りたい場所と方向へ単位仮想荷重1を置き、実荷重の曲げM、仮想荷重の曲げm、曲がりにくさEIを梁全体で積分してたわみを求める意味を示す。</desc>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <marker id="probeArrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="28" fill="url(#bg3)"/>
  <text x="64" y="70" font-family="'Yu Gothic',sans-serif" font-size="39" font-weight="700" fill="#0f172a">仮想荷重は“変位を見るための探針”</text>
  <rect x="58" y="105" width="520" height="310" rx="22" fill="#fff" stroke="#fed7aa" stroke-width="3"/>
  <g stroke="#475569" stroke-width="4">
    <line x1="112" y1="164" x2="112" y2="356"/>
    <line x1="82" y1="180" x2="112" y2="164"/><line x1="82" y1="220" x2="112" y2="204"/>
    <line x1="82" y1="260" x2="112" y2="244"/><line x1="82" y1="300" x2="112" y2="284"/>
    <line x1="82" y1="340" x2="112" y2="324"/>
  </g>
  <path d="M112 280 Q310 278 510 310" fill="none" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
  <circle cx="510" cy="310" r="10" fill="#1d4ed8"/>
  <text x="488" y="350" font-family="'Yu Gothic',sans-serif" font-size="24" font-weight="700" fill="#1e3a8a">翼端 O</text>
  <line x1="510" y1="156" x2="510" y2="268" stroke="#7c3aed" stroke-width="9" marker-end="url(#probeArrow)"/>
  <text x="371" y="148" font-family="'Yu Gothic',sans-serif" font-size="26" font-weight="800" fill="#6d28d9">仮想荷重 1</text>
  <text x="278" y="390" text-anchor="middle" font-family="'Yu Gothic',sans-serif" font-size="22" fill="#475569">知りたい場所へ・知りたい方向に置く</text>
  <rect x="612" y="105" width="532" height="310" rx="22" fill="#1e1b4b"/>
  <text x="878" y="159" text-anchor="middle" font-family="'Yu Gothic',sans-serif" font-size="24" font-weight="700" fill="#c4b5fd">たわみ</text>
  <text x="878" y="229" text-anchor="middle" font-family="Georgia,serif" font-size="52" font-style="italic" font-weight="700" fill="#fff">δ = ∫ Mm/(EI) dx</text>
  <g font-family="'Yu Gothic',sans-serif" font-size="23">
    <text x="662" y="285" fill="#bfdbfe"><tspan font-weight="800" fill="#60a5fa">M</tspan> ＝ 実際の荷重による曲げ</text>
    <text x="662" y="325" fill="#ddd6fe"><tspan font-weight="800" fill="#a78bfa">m</tspan> ＝ 知りたい方向への効き</text>
    <text x="662" y="365" fill="#fde68a"><tspan font-weight="800" fill="#facc15">EI</tspan> ＝ 梁の曲がりにくさ</text>
    <text x="662" y="402" fill="#bbf7d0"><tspan font-weight="800" fill="#4ade80">∫</tspan> ＝ 梁全体について足す</text>
  </g>
  <g font-family="'Yu Gothic',sans-serif">
    <rect x="58" y="450" width="260" height="112" rx="18" fill="#dbeafe"/>
    <text x="188" y="490" text-anchor="middle" font-size="25" font-weight="800" fill="#1d4ed8">実荷重 M</text>
    <text x="188" y="529" text-anchor="middle" font-size="20" fill="#334155">実際に曲がろうとする量</text>
    <rect x="340" y="450" width="260" height="112" rx="18" fill="#ede9fe"/>
    <text x="470" y="490" text-anchor="middle" font-size="25" font-weight="800" fill="#6d28d9">仮想荷重 m</text>
    <text x="470" y="529" text-anchor="middle" font-size="20" fill="#334155">変位方向への効きやすさ</text>
    <rect x="622" y="450" width="236" height="112" rx="18" fill="#fef9c3"/>
    <text x="740" y="490" text-anchor="middle" font-size="25" font-weight="800" fill="#a16207">÷ EI</text>
    <text x="740" y="529" text-anchor="middle" font-size="20" fill="#334155">硬いほど変位は小さい</text>
    <rect x="880" y="450" width="264" height="112" rx="18" fill="#dcfce7"/>
    <text x="1012" y="490" text-anchor="middle" font-size="25" font-weight="800" fill="#15803d">梁全体を ∫</text>
    <text x="1012" y="529" text-anchor="middle" font-size="20" fill="#334155">小さな効きを全部足す</text>
  </g>
  <rect x="58" y="590" width="1086" height="53" rx="14" fill="#7c2d12"/>
  <text x="601" y="625" text-anchor="middle" font-family="'Yu Gothic',sans-serif" font-size="25" font-weight="700" fill="#fff">計算ルール：∫₀ˡ x⁴ dx = l⁵/5　（理論より、まずこの形を使う）</text>
</svg>
