<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <title>ねじり応力は断面形状で決まる</title><desc>正方形断面、ねじりモーメント、係数表、最大ねじり応力の計算を示す。</desc>
  <defs><style>text{font-family:'Noto Sans JP','Yu Gothic',sans-serif;fill:#0f172a}.title{font-size:43px;font-weight:800}.label{font-size:25px;font-weight:700}.small{font-size:20px}.formula{font-size:42px;font-weight:800}</style><marker id="b" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker></defs>
  <rect width="1200" height="720" rx="32" fill="#f8fafc"/><rect x="35" y="30" width="1130" height="82" rx="22" fill="#e0f2fe"/><text x="70" y="85" class="title">ねじり応力は断面形状で決まる</text>
  <rect x="65" y="145" width="390" height="385" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="145" y="215" width="230" height="230" rx="5" fill="#dbeafe" stroke="#0f766e" stroke-width="6"/><path d="M165 260 C190 205 325 190 360 250" fill="none" stroke="#7c3aed" stroke-width="7" marker-end="url(#b)"/><text x="205" y="305" class="label" fill="#7c3aed">T</text>
  <line x1="145" y1="475" x2="375" y2="475" stroke="#2563eb" stroke-width="3" marker-start="url(#b)" marker-end="url(#b)"/><text x="245" y="510" class="label" fill="#2563eb">b = 50 mm</text>
  <line x1="405" y1="215" x2="405" y2="445" stroke="#2563eb" stroke-width="3" marker-start="url(#b)" marker-end="url(#b)"/><text x="270" y="190" class="label" fill="#2563eb">a = 50 mm</text>
  <rect x="495" y="145" width="635" height="175" rx="24" fill="#ecfdf5"/><text x="535" y="195" class="label">今回与えられた長方形断面の式</text><text x="570" y="275" class="formula" fill="#0f766e">τmax = T / (k1 a b²)</text>
  <rect x="495" y="345" width="285" height="185" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="530" y="390" class="label">係数表（抜粋）</text><line x1="520" y1="415" x2="755" y2="415" stroke="#94a3b8" stroke-width="2"/><text x="545" y="454" class="small">a/b</text><text x="675" y="454" class="small">k1</text><rect x="520" y="470" width="235" height="45" rx="8" fill="#fef3c7"/><text x="550" y="500" class="label">1.0</text><text x="670" y="500" class="label" fill="#ea580c">0.208</text>
  <rect x="810" y="345" width="320" height="185" rx="22" fill="#fff7ed"/><text x="845" y="390" class="label">単位を先に統一</text><text x="845" y="435" class="small">3.2 kN・m</text><text x="845" y="470" class="label" fill="#ea580c">= 3200000 N・mm</text><text x="845" y="505" class="small">N/mm² = MPa</text>
  <rect x="70" y="565" width="1060" height="105" rx="22" fill="#f5f3ff"/><text x="105" y="610" class="label">計算例</text><text x="235" y="610" class="formula" fill="#7c3aed">τmax ≒ 123.08 MPa</text><text x="245" y="650" class="small" fill="#92400e">係数は問題文の表から読む。丸軸の公式と混同しない。</text>
</svg>
