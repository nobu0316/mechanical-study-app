<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">ころを付ける目的</title>
  <desc id="desc">尖った先端のすべりと、ころ付き先端の転がり接触を対比する図</desc>
  <rect width="960" height="540" rx="28" fill="#f7fafc"/>
  <text x="54" y="66" font-family="sans-serif" font-size="34" font-weight="700" fill="#17324d">ころを付ける目的</text>
  <rect x="54" y="104" width="390" height="320" rx="24" fill="#fff4ef" stroke="#f0c4b6" stroke-width="2"/>
  <rect x="516" y="104" width="390" height="320" rx="24" fill="#eef8f6" stroke="#b9ddd8" stroke-width="2"/>
  <text x="168" y="148" font-family="sans-serif" font-size="28" font-weight="700" fill="#a94028">尖った先端</text>
  <text x="630" y="148" font-family="sans-serif" font-size="28" font-weight="700" fill="#12656a">ころ付き先端</text>
  <path d="M94 340 C170 280 256 380 404 300" fill="none" stroke="#365b73" stroke-width="14" stroke-linecap="round"/>
  <rect x="225" y="174" width="48" height="112" rx="12" fill="#7896a8"/>
  <path d="M225 286 L249 326 L273 286 Z" fill="#e25d3f"/>
  <path d="M172 356 C202 370 232 368 258 351" fill="none" stroke="#e25d3f" stroke-width="5" stroke-dasharray="9 7"/>
  <text x="134" y="401" font-family="sans-serif" font-size="25" font-weight="700" fill="#a94028">すべり → 摩耗</text>
  <path d="M556 340 C632 280 718 380 866 300" fill="none" stroke="#365b73" stroke-width="14" stroke-linecap="round"/>
  <rect x="687" y="168" width="48" height="88" rx="12" fill="#7896a8"/>
  <line x1="711" y1="256" x2="711" y2="276" stroke="#7896a8" stroke-width="10"/>
  <circle cx="711" cy="306" r="34" fill="#ffffff" stroke="#167c80" stroke-width="9"/>
  <circle cx="711" cy="306" r="8" fill="#167c80"/>
  <path d="M682 290 A34 34 0 0 1 725 274" fill="none" stroke="#e25d3f" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="606" y="401" font-family="sans-serif" font-size="25" font-weight="700" fill="#12656a">転がる → 摩耗低減</text>
  <rect x="226" y="454" width="508" height="58" rx="18" fill="#dff3f1"/>
  <text x="318" y="493" font-family="sans-serif" font-size="30" font-weight="700" fill="#12656a">ころ → 転がり接触</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L10 3 L0 6 Z" fill="#e25d3f"/></marker></defs>
</svg>
