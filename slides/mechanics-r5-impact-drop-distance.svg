<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">落ちたエネルギーを棒が受け止める</title>
  <desc id="desc">錘が高さhを落下した後も構造がδだけ沈み、総距離h+δの位置エネルギーを棒のひずみエネルギーが受け止める図</desc>
  <rect width="960" height="540" rx="28" fill="#f7fafc"/>
  <text x="52" y="62" font-family="sans-serif" font-size="34" font-weight="700" fill="#17324d">落ちたエネルギーを棒が受け止める</text>

  <rect x="52" y="96" width="348" height="358" rx="24" fill="#fff8e8" stroke="#ead29d" stroke-width="2"/>
  <rect x="174" y="126" width="104" height="54" rx="12" fill="#f2b84b"/>
  <text x="197" y="161" font-family="sans-serif" font-size="23" font-weight="700" fill="#17324d">錘 M</text>
  <line x1="226" y1="184" x2="226" y2="287" stroke="#e25d3f" stroke-width="6" marker-end="url(#redArrow)"/>
  <text x="250" y="241" font-family="sans-serif" font-size="28" font-weight="700" fill="#a94028">h</text>
  <line x1="94" y1="305" x2="356" y2="305" stroke="#7896a8" stroke-width="5"/>
  <text x="97" y="292" font-family="sans-serif" font-size="20" fill="#365b73">衝突</text>
  <line x1="226" y1="314" x2="226" y2="376" stroke="#167c80" stroke-width="6" marker-end="url(#greenArrow)"/>
  <text x="250" y="356" font-family="sans-serif" font-size="28" font-weight="700" fill="#12656a">δ</text>
  <path d="M122 398 Q226 354 330 398" fill="none" stroke="#167c80" stroke-width="7"/>
  <text x="111" y="431" font-family="sans-serif" font-size="21" font-weight="700" fill="#12656a">衝突後もさらに沈む</text>

  <rect x="438" y="96" width="470" height="358" rx="24" fill="#ffffff" stroke="#d5e2ea" stroke-width="2"/>
  <text x="484" y="145" font-family="sans-serif" font-size="23" font-weight="700" fill="#365b73">実際の落下距離</text>
  <text x="580" y="195" font-family="sans-serif" font-size="42" font-weight="700" fill="#e25d3f">h + δ</text>
  <line x1="673" y1="210" x2="673" y2="244" stroke="#e25d3f" stroke-width="5" marker-end="url(#redArrow)"/>
  <text x="500" y="282" font-family="sans-serif" font-size="25" font-weight="700" fill="#17324d">Mg(h + δ)</text>
  <text x="646" y="282" font-family="sans-serif" font-size="21" fill="#365b73">位置エネルギー</text>
  <line x1="673" y1="296" x2="673" y2="330" stroke="#e25d3f" stroke-width="5" marker-end="url(#redArrow)"/>
  <text x="492" y="369" font-family="sans-serif" font-size="25" font-weight="700" fill="#12656a">棒のひずみエネルギー</text>
  <text x="488" y="414" font-family="sans-serif" font-size="22" fill="#365b73">落下で失う量 ＝ 棒が蓄える量</text>

  <rect x="154" y="474" width="652" height="46" rx="16" fill="#fde5df"/>
  <text x="282" y="505" font-family="sans-serif" font-size="25" font-weight="700" fill="#a94028">hだけではない。衝突後もδだけ沈む</text>
  <defs>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L10 3 L0 6 Z" fill="#e25d3f"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L10 3 L0 6 Z" fill="#167c80"/></marker>
  </defs>
</svg>
