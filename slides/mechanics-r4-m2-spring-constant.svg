<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <title>1 mm変形させる力</title><desc>硬いばねと柔らかいばねの変位を比較し、ばね定数の意味を示す。</desc>
  <defs><style>text{font-family:'Noto Sans JP','Yu Gothic',sans-serif;fill:#0f172a}.title{font-size:46px;font-weight:800}.label{font-size:26px;font-weight:700}.small{font-size:21px}.formula{font-size:58px;font-weight:800}</style><marker id="o" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#f97316"/></marker></defs>
  <rect width="1200" height="720" rx="32" fill="#f8fafc"/><rect x="35" y="30" width="1130" height="82" rx="22" fill="#e0f2fe"/><text x="70" y="86" class="title">1 mm変形させる力</text>
  <rect x="70" y="150" width="480" height="350" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="130" y="200" class="label">硬いばね：k 大</text><line x1="260" y1="215" x2="260" y2="250" stroke="#334155" stroke-width="8"/><path d="M260 250 l-55 25 110 35-110 35 110 35-55 25" fill="none" stroke="#0f766e" stroke-width="9"/><rect x="190" y="405" width="140" height="55" rx="8" fill="#fed7aa"/><line x1="260" y1="460" x2="260" y2="490" stroke="#f97316" stroke-width="6" marker-end="url(#o)"/><text x="290" y="485" class="small" fill="#ea580c">同じP</text><text x="350" y="335" class="small" fill="#2563eb">δ 小</text>
  <rect x="650" y="150" width="480" height="350" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="710" y="200" class="label">柔らかいばね：k 小</text><line x1="840" y1="215" x2="840" y2="250" stroke="#334155" stroke-width="8"/><path d="M840 250 l-55 22 110 32-110 32 110 32-110 32 110 32-55 22" fill="none" stroke="#38bdf8" stroke-width="9"/><rect x="770" y="454" width="140" height="55" rx="8" fill="#fed7aa"/><line x1="840" y1="509" x2="840" y2="539" stroke="#f97316" stroke-width="6" marker-end="url(#o)"/><text x="870" y="534" class="small" fill="#ea580c">同じP</text><text x="930" y="365" class="small" fill="#2563eb">δ 大</text>
  <rect x="70" y="560" width="660" height="115" rx="24" fill="#ecfdf5"/><text x="115" y="635" class="formula" fill="#0f766e">k = P / δ</text><text x="480" y="615" class="label">1 mm変形させるのに</text><text x="480" y="650" class="label">必要な力</text>
  <rect x="760" y="560" width="370" height="115" rx="24" fill="#fff7ed"/><text x="800" y="605" class="label">単位をそろえる</text><text x="800" y="650" class="label" fill="#ea580c">1 N/mm = 1000 N/m</text>
</svg>
