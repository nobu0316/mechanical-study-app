<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <title>Iは3乗・12、Zは2乗・6</title><desc>断面二次モーメントIを中立軸から最外縁までの距離h/2で割って断面係数Zを導く。</desc>
  <defs><style>text{font-family:'Noto Sans JP','Yu Gothic',sans-serif;fill:#0f172a}.title{font-size:44px;font-weight:800}.label{font-size:25px;font-weight:700}.small{font-size:20px}.formula{font-size:45px;font-weight:800}</style><marker id="b" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker></defs>
  <rect width="1200" height="720" rx="32" fill="#f8fafc"/><rect x="35" y="30" width="1130" height="82" rx="22" fill="#e0f2fe"/><text x="70" y="86" class="title">Iは3乗・12、Zは2乗・6</text>
  <rect x="65" y="145" width="390" height="395" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><rect x="150" y="205" width="210" height="270" fill="#bae6fd" stroke="#0f766e" stroke-width="5"/><line x1="115" y1="340" x2="395" y2="340" stroke="#0f172a" stroke-width="4" stroke-dasharray="11 8"/><text x="95" y="325" class="small">中立軸</text><line x1="395" y1="340" x2="395" y2="205" stroke="#2563eb" stroke-width="3" marker-start="url(#b)" marker-end="url(#b)"/><text x="405" y="280" class="label" fill="#2563eb">c = h/2</text><text x="180" y="510" class="label">最外縁までの距離</text>
  <rect x="500" y="145" width="630" height="155" rx="24" fill="#eff6ff"/><text x="540" y="195" class="label">断面二次モーメント</text><text x="620" y="260" class="formula" fill="#2563eb">I = bh³ / 12</text><text x="970" y="255" class="label">mm⁴</text>
  <path d="M815 315 v55" stroke="#f97316" stroke-width="6" marker-end="url(#b)"/><text x="845" y="350" class="small" fill="#ea580c">h/2 で割る</text>
  <rect x="500" y="385" width="630" height="155" rx="24" fill="#ecfdf5"/><text x="540" y="435" class="label">断面係数</text><text x="565" y="505" class="formula" fill="#0f766e">Z = I/(h/2) = bh²/6</text><text x="1010" y="500" class="label">mm³</text>
  <rect x="70" y="575" width="1060" height="105" rx="22" fill="#fff7ed"/><text x="110" y="620" class="label">50 mm角</text><text x="300" y="620" class="label" fill="#2563eb">I ≒ 520833 mm⁴</text><text x="650" y="620" class="label" fill="#0f766e">Z ≒ 20833.3 mm³</text><text x="265" y="660" class="small" fill="#92400e">IとZは、指数・分母・単位・使い道を一組で区別する。</text>
</svg>
