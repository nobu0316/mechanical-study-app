<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">力学③（4）～（6）の一本道</title>
  <desc id="desc">軸力から棒の伸び、ひずみエネルギー、h+δ、位置エネルギー、エネルギー一致、最大変位へ進む縦フロー</desc>
  <rect width="960" height="540" rx="28" fill="#f7fafc"/>
  <text x="52" y="56" font-family="sans-serif" font-size="32" font-weight="700" fill="#17324d">力学③（4）～（6）の一本道</text>

  <g font-family="sans-serif" font-size="21" font-weight="700" text-anchor="middle">
    <rect x="92" y="92" width="300" height="58" rx="17" fill="#e8f3fb" stroke="#b8d5e8" stroke-width="2"/>
    <text x="242" y="128" fill="#17324d">① 軸力 T1 を求める</text>
    <rect x="92" y="178" width="300" height="58" rx="17" fill="#e8f3fb" stroke="#b8d5e8" stroke-width="2"/>
    <text x="242" y="214" fill="#17324d">② 棒の伸び λ を求める</text>
    <rect x="92" y="264" width="300" height="58" rx="17" fill="#eef8f6" stroke="#b9ddd8" stroke-width="2"/>
    <text x="242" y="300" fill="#12656a">③ ひずみエネルギー</text>
    <rect x="568" y="92" width="300" height="58" rx="17" fill="#fff8e8" stroke="#ead29d" stroke-width="2"/>
    <text x="718" y="128" fill="#a94028">④ 落下距離 h + δ</text>
    <rect x="568" y="178" width="300" height="58" rx="17" fill="#fff8e8" stroke="#ead29d" stroke-width="2"/>
    <text x="718" y="214" fill="#a94028">⑤ 位置エネルギー</text>
    <rect x="568" y="264" width="300" height="58" rx="17" fill="#fde5df" stroke="#e7b8aa" stroke-width="2"/>
    <text x="718" y="300" fill="#a94028">⑥ 2つを等しくする</text>
    <rect x="330" y="365" width="300" height="62" rx="19" fill="#dff3f1" stroke="#a8d6d1" stroke-width="2"/>
    <text x="480" y="403" font-size="24" fill="#12656a">最大変位 δ を求める</text>
  </g>

  <g fill="none" stroke="#e25d3f" stroke-width="5" marker-end="url(#redArrow)">
    <line x1="242" y1="151" x2="242" y2="171"/>
    <line x1="242" y1="237" x2="242" y2="257"/>
    <path d="M392 293 C470 293 490 121 560 121"/>
    <line x1="718" y1="151" x2="718" y2="171"/>
    <line x1="718" y1="237" x2="718" y2="257"/>
    <path d="M718 323 C718 357 660 394 639 394"/>
  </g>
  <text x="424" y="276" font-family="sans-serif" font-size="18" font-weight="700" fill="#a94028">錘を落とす</text>

  <rect x="106" y="460" width="748" height="54" rx="18" fill="#17324d"/>
  <text x="184" y="496" font-family="sans-serif" font-size="29" font-weight="700" fill="#ffffff">力 → 伸び → エネルギー → 落下 → 変位</text>
  <defs>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L10 3 L0 6 Z" fill="#e25d3f"/></marker>
  </defs>
</svg>
