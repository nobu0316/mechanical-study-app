<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">三角形分布荷重は1本の力に置き換える</title>
  <desc id="desc">三角形分布荷重の合力が三角形の面積に等しく、作用位置は太い側から3分の1であることと、曲げモーメントまでの4ステップを示す。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f9ff"/>
      <stop offset="1" stop-color="#e9f3ff"/>
    </linearGradient>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#ef4444"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="28" fill="url(#bg)"/>
  <text x="64" y="72" font-family="'Yu Gothic',sans-serif" font-size="38" font-weight="700" fill="#0f172a">三角形分布荷重は1本の力に置き換える</text>
  <rect x="54" y="101" width="700" height="420" rx="22" fill="#fff" stroke="#bfdbfe" stroke-width="3"/>
  <text x="94" y="143" font-family="'Yu Gothic',sans-serif" font-size="22" font-weight="700" fill="#64748b">分布している力</text>
  <line x1="110" y1="356" x2="680" y2="356" stroke="#334155" stroke-width="7" stroke-linecap="round"/>
  <polygon points="120,336 670,176 670,336" fill="#dbeafe" stroke="#60a5fa" stroke-width="3"/>
  <g stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)">
    <line x1="120" y1="328" x2="120" y2="350"/>
    <line x1="200" y1="305" x2="200" y2="350"/>
    <line x1="280" y1="282" x2="280" y2="350"/>
    <line x1="360" y1="259" x2="360" y2="350"/>
    <line x1="440" y1="236" x2="440" y2="350"/>
    <line x1="520" y1="213" x2="520" y2="350"/>
    <line x1="600" y1="190" x2="600" y2="350"/>
    <line x1="670" y1="170" x2="670" y2="350"/>
  </g>
  <text x="104" y="390" font-family="'Yu Gothic',sans-serif" font-size="21" fill="#475569">細い側 0</text>
  <text x="588" y="390" font-family="'Yu Gothic',sans-serif" font-size="21" font-weight="700" fill="#1d4ed8">太い側 最大</text>
  <line x1="120" y1="427" x2="670" y2="427" stroke="#94a3b8" stroke-width="2"/>
  <line x1="120" y1="417" x2="120" y2="437" stroke="#94a3b8" stroke-width="2"/>
  <line x1="670" y1="417" x2="670" y2="437" stroke="#94a3b8" stroke-width="2"/>
  <text x="385" y="454" text-anchor="middle" font-family="'Yu Gothic',sans-serif" font-size="25" font-style="italic" fill="#334155">x</text>
  <text x="785" y="148" font-family="'Yu Gothic',sans-serif" font-size="22" font-weight="700" fill="#64748b">1本の合力へ</text>
  <line x1="920" y1="190" x2="920" y2="350" stroke="#ef4444" stroke-width="10" marker-end="url(#arrowRed)"/>
  <text x="940" y="235" font-family="'Yu Gothic',sans-serif" font-size="25" font-weight="700" fill="#dc2626">合力</text>
  <text x="940" y="270" font-family="'Yu Gothic',sans-serif" font-size="22" fill="#475569">＝三角形の面積</text>
  <line x1="920" y1="406" x2="1080" y2="406" stroke="#f97316" stroke-width="4"/>
  <line x1="920" y1="394" x2="920" y2="418" stroke="#f97316" stroke-width="4"/>
  <line x1="1080" y1="394" x2="1080" y2="418" stroke="#f97316" stroke-width="4"/>
  <text x="1000" y="443" text-anchor="middle" font-family="'Yu Gothic',sans-serif" font-size="26" font-weight="700" fill="#c2410c">太い側から x/3</text>
  <rect x="54" y="548" width="1092" height="83" rx="18" fill="#172554"/>
  <text x="600" y="602" text-anchor="middle" font-family="'Yu Gothic',sans-serif" font-size="38" font-weight="800" fill="#fff">三角形 → 太い側から 1/3</text>
  <g font-family="'Yu Gothic',sans-serif" font-size="20" font-weight="700">
    <rect x="85" y="474" width="230" height="44" rx="12" fill="#dbeafe"/><text x="200" y="503" text-anchor="middle" fill="#1e40af">① 切断位置の高さ</text>
    <rect x="333" y="474" width="230" height="44" rx="12" fill="#dcfce7"/><text x="448" y="503" text-anchor="middle" fill="#166534">② 面積＝合力</text>
    <rect x="581" y="474" width="230" height="44" rx="12" fill="#ffedd5"/><text x="696" y="503" text-anchor="middle" fill="#9a3412">③ 太い側から1/3</text>
    <rect x="829" y="474" width="285" height="44" rx="12" fill="#fee2e2"/><text x="972" y="503" text-anchor="middle" fill="#991b1b">④ 合力×距離＝M</text>
  </g>
</svg>
