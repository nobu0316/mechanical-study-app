<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="shaft" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eefbfc"/><stop offset="1" stop-color="#cceff2"/></linearGradient>
    <marker id="arrowF" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#f15a24"/></marker>
    <marker id="arrowT" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0b2e67"/></marker>
    <marker id="arrowDim" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#138a8f"/></marker>
    <style>text{font-family:Arial,'Yu Gothic',Meiryo,sans-serif;fill:#0a1830}.title{font-size:51px;font-weight:800}.message{font-size:28px;font-weight:800}.head{font-size:27px;font-weight:800}.body{font-size:22px}.small{font-size:18px}.symbol{font-size:36px;font-weight:800}.navy{fill:#0b2e67}.orange{fill:#f15a24}.teal{fill:#138a8f}.white{fill:#fff}</style>
  </defs>
  <rect width="1200" height="675" fill="#fbfdff"/><rect width="14" height="675" fill="#0b2e67"/>
  <text x="42" y="61" class="title">円周力とは何か</text>
  <rect x="42" y="82" width="1116" height="58" rx="12" fill="#0b2e67"/>
  <text x="600" y="121" text-anchor="middle" class="message white"><tspan class="orange">円周力 F</tspan><tspan> ＝ 軸の外周でトルクを伝える接線方向の力</tspan></text>
  <g aria-label="共通の軸断面図">
    <circle cx="310" cy="352" r="168" fill="url(#shaft)" stroke="#075b66" stroke-width="6"/><circle cx="310" cy="352" r="8" fill="#0b2e67"/>
    <line x1="310" y1="352" x2="310" y2="184" stroke="#138a8f" stroke-width="5" marker-start="url(#arrowDim)" marker-end="url(#arrowDim)"/><text x="330" y="275" class="head teal">半径 d/2</text>
    <rect x="282" y="168" width="56" height="42" rx="4" fill="#ffc857" stroke="#7a4a00" stroke-width="4"/><text x="343" y="178" class="small">キー</text>
    <line x1="339" y1="189" x2="564" y2="189" stroke="#f15a24" stroke-width="8" marker-end="url(#arrowF)"/><text x="421" y="174" class="symbol orange">F</text><text x="477" y="174" class="body orange">接線方向</text>
    <path d="M139 428A194 194 0 0 1 171 239" fill="none" stroke="#0b2e67" stroke-width="8" marker-end="url(#arrowT)"/><text x="69" y="347" class="symbol navy">T</text>
    <text x="249" y="382" class="small">軸中心</text><line x1="145" y1="492" x2="180" y2="468" stroke="#138a8f" stroke-width="3"/><text x="52" y="516" class="head teal">軸外周</text>
  </g>
  <g aria-label="3つの要点">
    <line x1="633" y1="180" x2="1158" y2="180" stroke="#d5dee8" stroke-width="2"/>
    <circle cx="671" cy="220" r="25" fill="#0b2e67"/><text x="671" y="229" text-anchor="middle" class="head white">1</text><text x="718" y="214" class="head navy">トルク T</text><text x="718" y="247" class="body">軸を回そうとする働き</text>
    <line x1="633" y1="273" x2="1158" y2="273" stroke="#d5dee8" stroke-width="2"/>
    <circle cx="671" cy="319" r="25" fill="#0b2e67"/><text x="671" y="328" text-anchor="middle" class="head white">2</text><text x="718" y="313" class="head">キーは軸の外周で</text><text x="718" y="346" class="body">トルクを伝える</text>
    <line x1="633" y1="372" x2="1158" y2="372" stroke="#d5dee8" stroke-width="2"/>
    <circle cx="671" cy="418" r="25" fill="#f15a24"/><text x="671" y="427" text-anchor="middle" class="head white">3</text><text x="718" y="412" class="head orange">その位置に働く接線方向の力が</text><text x="718" y="448" class="symbol orange">円周力 F</text>
  </g>
  <g aria-label="レンチのイメージ">
    <rect x="42" y="545" width="1116" height="92" rx="12" fill="#f4f7fa" stroke="#cbd6e1" stroke-width="2"/><text x="65" y="577" class="head">レンチも同じ</text>
    <circle cx="205" cy="600" r="14" fill="none" stroke="#0a1830" stroke-width="6"/><line x1="219" y1="600" x2="390" y2="600" stroke="#75828e" stroke-width="14" stroke-linecap="round"/><line x1="390" y1="600" x2="390" y2="566" stroke="#f15a24" stroke-width="6" marker-end="url(#arrowF)"/><text x="292" y="628" text-anchor="middle" class="small">長いレンチ → 小さい力</text>
    <circle cx="482" cy="600" r="14" fill="none" stroke="#0a1830" stroke-width="6"/><line x1="496" y1="600" x2="575" y2="600" stroke="#75828e" stroke-width="14" stroke-linecap="round"/><line x1="575" y1="600" x2="575" y2="566" stroke="#f15a24" stroke-width="6" marker-end="url(#arrowF)"/><text x="530" y="628" text-anchor="middle" class="small">短いレンチ → 大きい力</text>
    <text x="660" y="579" class="head navy">中心から遠いほど</text><text x="660" y="616" class="head navy">同じトルクを小さい力で伝えられる</text>
  </g>
</svg>
