<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <title>曲げ応力はMをZで割る</title><desc>曲げを受ける棒の圧縮側と引張り側、および曲げ応力の公式と計算例を示す。</desc>
  <defs><style>text{font-family:'Noto Sans JP','Yu Gothic',sans-serif;fill:#0f172a}.title{font-size:46px;font-weight:800}.label{font-size:25px;font-weight:700}.small{font-size:20px}.formula{font-size:54px;font-weight:800}.calcFormula{font-size:44px;font-weight:800}</style><marker id="o" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#f97316"/></marker></defs>
  <rect width="1200" height="720" rx="32" fill="#f8fafc"/><rect x="35" y="30" width="1130" height="82" rx="22" fill="#e0f2fe"/><text x="70" y="86" class="title">曲げ応力はMをZで割る</text>
  <rect x="65" y="145" width="560" height="380" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><rect x="105" y="210" width="65" height="230" rx="7" fill="#64748b"/><path d="M170 315 Q365 390 560 315" fill="none" stroke="#0f766e" stroke-width="30"/><line x1="560" y1="190" x2="560" y2="290" stroke="#f97316" stroke-width="7" marker-end="url(#o)"/><text x="580" y="235" class="label" fill="#ea580c">荷重</text><path d="M230 266 Q365 305 500 266" fill="none" stroke="#dc2626" stroke-width="8"/><path d="M225 355 Q365 415 505 355" fill="none" stroke="#2563eb" stroke-width="8"/><text x="260" y="245" class="label" fill="#dc2626">圧縮</text><text x="260" y="455" class="label" fill="#2563eb">引張り</text><line x1="180" y1="320" x2="535" y2="320" stroke="#334155" stroke-width="3" stroke-dasharray="10 8"/><text x="380" y="310" class="small">中立軸</text>
  <rect x="670" y="145" width="460" height="180" rx="24" fill="#ecfdf5"/><text x="710" y="200" class="label">外縁の曲げ応力</text><text x="755" y="285" class="formula" fill="#0f766e">σb = M / Z</text>
  <rect x="670" y="350" width="460" height="175" rx="24" fill="#eff6ff"/><text x="710" y="400" class="label">単位</text><text x="710" y="445" class="small">M：N・mm　Z：mm³</text><text x="710" y="490" class="label" fill="#2563eb">σb：N/mm² = MPa</text>
  <rect x="70" y="565" width="1060" height="105" rx="22" fill="#fff7ed"/><text x="110" y="610" class="label">今回の値</text><text x="290" y="610" class="calcFormula" fill="#ea580c">5600000 / 20833.3 ≒ 268.8 MPa</text><text x="350" y="655" class="small" fill="#92400e">Iではなく断面係数Zで割る。</text>
</svg>
