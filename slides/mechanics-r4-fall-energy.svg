<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">高さのエネルギーが速さに変わる</title>
  <desc id="desc">高い位置の位置エネルギーmghが落下によって運動エネルギー1/2 mv二乗へ変わり、v二乗イコール2ghへつながる図</desc>
  <rect width="960" height="540" rx="28" fill="#f7fafc"/>
  <text x="54" y="66" font-family="sans-serif" font-size="34" font-weight="700" fill="#17324d">高さのエネルギーが速さに変わる</text>
  <rect x="54" y="104" width="316" height="230" rx="24" fill="#e8f3fb" stroke="#b8d5e8" stroke-width="2"/>
  <text x="100" y="150" font-family="sans-serif" font-size="25" font-weight="700" fill="#28617f">高い位置</text>
  <circle cx="212" cy="212" r="34" fill="#f2b84b"/>
  <line x1="212" y1="246" x2="212" y2="292" stroke="#7896a8" stroke-width="5" stroke-dasharray="8 7"/>
  <text x="116" y="316" font-family="sans-serif" font-size="32" font-weight="700" fill="#17324d">mgh</text>
  <path d="M394 214 H525" stroke="#e25d3f" stroke-width="7" marker-end="url(#arrow)"/>
  <text x="421" y="191" font-family="sans-serif" font-size="24" font-weight="700" fill="#a94028">落下</text>
  <text x="404" y="254" font-family="sans-serif" font-size="23" fill="#365b73">高さ → 速さ</text>
  <rect x="558" y="104" width="348" height="230" rx="24" fill="#eef8f6" stroke="#b9ddd8" stroke-width="2"/>
  <text x="606" y="150" font-family="sans-serif" font-size="25" font-weight="700" fill="#12656a">落下直前の速さ</text>
  <circle cx="656" cy="218" r="34" fill="#f2b84b"/>
  <path d="M704 196 H836" stroke="#167c80" stroke-width="7" marker-end="url(#greenArrow)"/>
  <text x="642" y="302" font-family="sans-serif" font-size="31" font-weight="700" fill="#17324d">1/2 mv²</text>
  <rect x="96" y="366" width="768" height="70" rx="20" fill="#ffffff" stroke="#d5e2ea" stroke-width="2"/>
  <text x="184" y="411" font-family="sans-serif" font-size="30" font-weight="700" fill="#17324d">mgh ＝ 1/2 mv²　→　v² ＝ 2gh</text>
  <rect x="188" y="466" width="584" height="50" rx="16" fill="#dff3f1"/>
  <text x="236" y="500" font-family="sans-serif" font-size="26" font-weight="700" fill="#12656a">位置エネルギー → 運動エネルギー</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L10 3 L0 6 Z" fill="#e25d3f"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L10 3 L0 6 Z" fill="#167c80"/></marker>
  </defs>
</svg>
