<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <title>硬いと速い、重いと遅い</title><desc>1自由度ばね質量系と固有振動数の公式、比例関係、単位注意を示す。</desc>
  <defs><style>text{font-family:'Noto Sans JP','Yu Gothic',sans-serif;fill:#0f172a}.title{font-size:46px;font-weight:800}.label{font-size:27px;font-weight:700}.small{font-size:21px}.formula{font-size:52px;font-weight:800}</style><marker id="p" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7c3aed"/></marker></defs>
  <rect width="1200" height="720" rx="32" fill="#f8fafc"/><rect x="35" y="30" width="1130" height="82" rx="22" fill="#e0f2fe"/><text x="70" y="86" class="title">硬いと速い、重いと遅い</text>
  <rect x="70" y="150" width="390" height="430" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><line x1="145" y1="190" x2="385" y2="190" stroke="#334155" stroke-width="12"/><path d="M265 190 v35 l-65 24 130 34-130 34 130 34-130 34 65 25 v35" fill="none" stroke="#0f766e" stroke-width="9"/><text x="335" y="310" class="label" fill="#0f766e">k</text><rect x="185" y="460" width="160" height="90" rx="12" fill="#fed7aa" stroke="#ea580c" stroke-width="4"/><text x="245" y="517" class="label">m</text><path d="M120 455 C75 490 75 535 120 565" fill="none" stroke="#7c3aed" stroke-width="5" marker-start="url(#p)" marker-end="url(#p)"/><text x="83" y="520" class="label" fill="#7c3aed">f</text>
  <rect x="505" y="150" width="625" height="195" rx="24" fill="#ecfdf5" stroke="#99f6e4" stroke-width="3"/><text x="545" y="200" class="label">固有振動数</text><text x="610" y="285" class="formula" fill="#0f766e">f = (1 / 2π) √(k / m)</text>
  <rect x="505" y="375" width="300" height="170" rx="22" fill="#eff6ff"/><text x="545" y="430" class="label" fill="#2563eb">k ↑ → f ↑</text><text x="545" y="475" class="small">kが4倍 → fは2倍</text><text x="545" y="515" class="small">硬いほど速い</text>
  <rect x="830" y="375" width="300" height="170" rx="22" fill="#fff7ed"/><text x="870" y="430" class="label" fill="#ea580c">m ↑ → f ↓</text><text x="870" y="475" class="small">mが4倍 → fは1/2</text><text x="870" y="515" class="small">重いほど遅い</text>
  <rect x="70" y="615" width="1060" height="70" rx="18" fill="#fef3c7"/><text x="110" y="660" class="label" fill="#92400e">単位注意：k は N/m、m は kg　／　1 N/mm = 1000 N/m</text>
</svg>
