<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="shaft" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eefbfc"/><stop offset="1" stop-color="#cceff2"/></linearGradient>
    <marker id="arrowF" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#f15a24"/></marker><marker id="arrowDim" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#138a8f"/></marker>
    <style>text{font-family:Arial,'Yu Gothic',Meiryo,sans-serif;fill:#0a1830}.title{font-size:49px;font-weight:800}.message{font-size:28px;font-weight:800}.head{font-size:25px;font-weight:800}.body{font-size:21px}.small{font-size:17px}.eq{font-size:31px;font-weight:800}.big{font-size:37px;font-weight:800}.navy{fill:#0b2e67}.orange{fill:#f15a24}.teal{fill:#138a8f}.red{fill:#d62828}.white{fill:#fff}</style>
  </defs>
  <rect width="1200" height="675" fill="#fbfdff"/><rect width="14" height="675" fill="#0b2e67"/><text x="42" y="59" class="title">なぜ F = 2T/d になるのか</text>
  <rect x="42" y="78" width="1116" height="56" rx="12" fill="#0b2e67"/><text x="600" y="116" text-anchor="middle" class="message white">キーまでの距離が <tspan class="teal">d/2</tspan> だから、<tspan class="orange">F = 2T/d</tspan></text>
  <g aria-label="4段階の式">
    <rect x="42" y="154" width="244" height="68" rx="11" fill="#eef4fb" stroke="#9cb8d8" stroke-width="2"/><text x="164" y="198" text-anchor="middle" class="eq navy">① T = F × r</text><text x="306" y="199" class="eq navy">→</text>
    <rect x="347" y="154" width="199" height="68" rx="11" fill="#eaf8f6" stroke="#7cc9bd" stroke-width="2"/><text x="447" y="198" text-anchor="middle" class="eq teal">② r = d/2</text><text x="565" y="199" class="eq navy">→</text>
    <rect x="607" y="154" width="265" height="68" rx="11" fill="#eef4fb" stroke="#9cb8d8" stroke-width="2"/><text x="740" y="198" text-anchor="middle" class="eq navy">③ T = F × d/2</text><text x="891" y="199" class="eq navy">→</text>
    <rect x="933" y="148" width="225" height="80" rx="11" fill="#fff1d6" stroke="#f15a24" stroke-width="4"/><text x="1046" y="200" text-anchor="middle" class="big orange">④ F = 2T/d</text>
  </g>
  <g aria-label="共通の軸断面図">
    <rect x="42" y="244" width="440" height="247" rx="14" fill="#fff" stroke="#cbd6e1" stroke-width="2"/><circle cx="220" cy="361" r="94" fill="url(#shaft)" stroke="#075b66" stroke-width="5"/><circle cx="220" cy="361" r="7" fill="#0b2e67"/>
    <line x1="220" y1="361" x2="220" y2="267" stroke="#138a8f" stroke-width="5" marker-start="url(#arrowDim)" marker-end="url(#arrowDim)"/><text x="238" y="319" class="head teal">d/2</text><line x1="126" y1="361" x2="314" y2="361" stroke="#138a8f" stroke-width="3" marker-start="url(#arrowDim)" marker-end="url(#arrowDim)"/><text x="220" y="396" text-anchor="middle" class="body teal">軸径 d</text>
    <rect x="204" y="251" width="32" height="27" rx="3" fill="#ffc857" stroke="#7a4a00" stroke-width="3"/><line x1="237" y1="264" x2="429" y2="264" stroke="#f15a24" stroke-width="7" marker-end="url(#arrowF)"/><text x="323" y="250" class="eq orange">F</text>
    <rect x="273" y="406" width="184" height="56" rx="9" fill="#eaf8f6"/><text x="365" y="430" text-anchor="middle" class="small teal">2が付く理由はここ</text><text x="365" y="452" text-anchor="middle" class="head teal">r = d/2</text>
  </g>
  <g aria-label="軸径比較">
    <rect x="501" y="244" width="305" height="247" rx="14" fill="#fff" stroke="#cbd6e1" stroke-width="2"/><text x="524" y="276" class="head navy">同じトルク T なら</text><circle cx="554" cy="337" r="35" fill="#d8f1f4" stroke="#075b66" stroke-width="4"/><line x1="591" y1="337" x2="647" y2="337" stroke="#75828e" stroke-width="12" stroke-linecap="round"/><text x="677" y="330" class="body">d 大 → d/2 大</text><text x="677" y="358" class="head orange">→ F 小</text>
    <line x1="524" y1="386" x2="782" y2="386" stroke="#dde4eb" stroke-width="2"/><circle cx="554" cy="435" r="21" fill="#d8f1f4" stroke="#075b66" stroke-width="4"/><line x1="577" y1="435" x2="623" y2="435" stroke="#75828e" stroke-width="12" stroke-linecap="round"/><text x="677" y="428" class="body">d 小 → d/2 小</text><text x="677" y="456" class="head orange">→ F 大</text>
  </g>
  <g aria-label="計算例">
    <rect x="825" y="244" width="333" height="247" rx="14" fill="#fff" stroke="#0b2e67" stroke-width="2"/><rect x="825" y="244" width="333" height="42" rx="12" fill="#0b2e67"/><text x="846" y="272" class="small white" font-weight="800">計算例　500 N・m ／ 50 mm</text><text x="847" y="320" class="body">500 N・m</text><text x="957" y="320" class="body navy">= 500000 N・mm</text><text x="847" y="360" class="body">F = 2T/d</text><text x="847" y="398" class="body">= 2 × 500000 / 50</text><text x="847" y="444" class="big orange">F = 20000 N</text>
  </g>
  <g aria-label="単位注意">
    <rect x="42" y="514" width="1116" height="123" rx="12" fill="#fff4f2" stroke="#d62828" stroke-width="3"/><rect x="42" y="514" width="175" height="123" rx="10" fill="#d62828"/><text x="130" y="584" text-anchor="middle" class="head white">単位注意</text><text x="250" y="565" class="head red">d を mm で使うなら、T も N・mm</text><text x="250" y="608" class="body red">N・m のまま mm で割らない</text><text x="715" y="566" class="head navy">「2」は暗記しない</text><text x="715" y="607" class="message navy">半径 d/2 から出てくる</text>
  </g>
</svg>
